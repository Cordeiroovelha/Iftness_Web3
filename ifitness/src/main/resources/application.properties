spring.application.name=ifitness

spring.jpa.database=MYSQL
spring.datasource.url=jdbc:mysql://localhost/ifitness?createDatabaseIfNotExist=true&useSSL=false&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true

spring.jackson.deserialization.fail-on-unknown-properties=true

# Porta: usa a variavel de ambiente PORT, se existir (as plataformas de nuvem definem essa variavel)
server.port=${PORT:8080}

# Configuracoes proprias da aplicacao (valores para o ambiente de desenvolvimento)
ifitness.cors.allowed-origin=http://localhost:4200
ifitness.jwt.access-token-seconds=300
ifitness.jwt.private-key=
ifitness.cookie.path=/auth
ifitness.cookie.secure=false